[package]
name = "mhservice"
version.workspace = true
edition.workspace = true
license.workspace = true
# Places the vendored native DLLs beside the produced exe so it can be run by
# double-clicking instead of only via a PATH-configured wrapper script.
build = "build.rs"

[[bin]]
name = "mhservice"
path = "src/main.rs"

[dependencies]
mhcore = { path = "../mhcore" }
mhstore = { path = "../mhstore" }
mhvision = { path = "../mhvision" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
csv.workspace = true
chrono.workspace = true
base64.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }
