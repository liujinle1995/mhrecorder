[workspace]
resolver = "2"
members = [
    "crates/mhcore",
    "crates/mhvision",
    "crates/mhstore",
    "crates/mhservice",
    "crates/mhcli",
    "crates/mhpack",
]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"
authors = ["mhrecorder"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ort = { version = "=2.0.0-rc.15", features = ["load-dynamic"] }
ndarray = "0.17"
opencv = { version = "0.101", default-features = false, features = [
    "imgproc",
    "imgcodecs",
    "features2d",
    "clang-runtime",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
